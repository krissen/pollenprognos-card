name: Validate HACS

on:
  push:
    branches: [master, dev]
  pull_request:
  schedule:
    # Run at an off-peak, odd-minute time (03:43 UTC) rather than midnight.
    # Top-of-the-hour crons like "0 0 * * *" hit GitHub's scheduled-workflow
    # rush, which rate-limited hacs/action's raw-content fetches and caused
    # flaky "no images in Readme" validation failures.
    - cron: "43 3 * * *"

jobs:
  validate-hacs:
    # Skip on PRs opened from a fork: hacs/action resolves the repository
    # from GITHUB_REPOSITORY at runtime, which for fork PRs points at the
    # fork (e.g. contributor/pollenprognos-card). The fork is not in HACS's
    # default repository list, so the check would always fail with
    # "Repository ... not loaded properly in HACS." The job still runs on
    # push to master/dev, on the daily schedule, and on PRs from this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HACS manifest & structure
        uses: hacs/action@main
        with:
          category: "plugin"
          ignore: "hacsjson"
