name: Test & Build

on:
  push:
    branches: [master, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # update-version.js (prebuild) reads git tags to stamp the version;
          # a shallow checkout would break the build step.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # eslint runs as a prek hook against this node_modules (language:
      # system), so it must exist before prek runs below.
      - name: Cache prek hook environments
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/prek
          key: prek-${{ runner.os }}-node20-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Quality gates (prek)
        env:
          PREK_HOME: ${{ runner.temp }}/prek
        run: pipx run --spec prek==0.5.2 prek run --all-files --show-diff-on-failure

      # The gitleaks pre-commit hook above only scans the *staged* diff,
      # which is empty in CI (no `git add` happens here) and would
      # otherwise silently report zero findings. Scan the full tree here
      # instead.
      - name: Scan whole tree for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run check-dist-size
